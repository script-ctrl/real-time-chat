<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ассасин: превью тайминга</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: monospace; color: #ccc; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 2; }
  button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 12px; margin-right: 6px; cursor: pointer; }
  #info { margin-top: 8px; }
</style>
</head>
<body>
<div id="ui">
  <button id="play">Пауза</button>
  <button id="speed">Скорость x1</button>
  <div id="info">тик: 0 / 160</div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const CYCLE = 160;
const SCALE = 1; // 1 блок = 1 единица Three.js
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 9);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dir = new THREE.DirectionalLight(0xffffff, 0.6);
dir.position.set(3, 6, 5);
scene.add(dir);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshLambertMaterial({ color: 0x222226 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Собираем персонажа из кубов. Pivot: (0,0,0) - точка стояния на земле.
function makeHumanoid(colors) {
  const root = new THREE.Group();
  const mat = c => new THREE.MeshLambertMaterial({ color: c });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.75, 0.3), mat(colors.body));
  body.position.y = 1.15;
  root.add(body);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat(colors.head));
  head.position.y = 1.85;
  root.add(head);

  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), mat(colors.arm));
  armL.position.set(-0.4, 1.1, 0);
  root.add(armL);

  const armR = armL.clone();
  armR.position.x = 0.4;
  root.add(armR);

  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.75, 0.22), mat(colors.leg));
  legL.position.set(-0.15, 0.375, 0);
  root.add(legL);

  const legR = legL.clone();
  legR.position.x = 0.15;
  root.add(legR);

  root.userData = { body, head, armL, armR, legL, legR };
  return root;
}

const steve = makeHumanoid({ head: 0x3a2a1e, body: 0xb08a2a, arm: 0xb08a2a, leg: 0x3a3ab0 });
const zombieA = makeHumanoid({ head: 0x4d7a3a, body: 0x2a7a7a, arm: 0x4d7a3a, leg: 0x2a2a7a });
const zombieB = zombieA.clone();
zombieB.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
scene.add(steve, zombieA, zombieB);

// Пыль
const dust = [];
const dustGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
const dustMat = new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.7 });
function spawnDust(x, y, z, count) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(dustGeo, dustMat.clone());
    m.position.set(x + (Math.random() - 0.5) * 0.4, y + Math.random() * 0.3, z + (Math.random() - 0.5) * 0.4);
    m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 0.05, Math.random() * 0.06, (Math.random() - 0.5) * 0.05);
    m.userData.life = 30;
    scene.add(m);
    dust.push(m);
  }
}

const clamp = v => Math.max(0, Math.min(1, v));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;

// Та же логика, что renderAssassin
function applyFrame(t) {
  zombieA.visible = zombieB.visible = t < 150;
  zombieA.position.set(-1.1, 0, 0);
  zombieB.position.set(1.1, 0, 0);
  zombieA.rotation.set(0, 0, 0);
  zombieB.rotation.set(0, 0, 0);
  if (t >= 60 && t < 150) {
    const roll = (Math.PI / 2) * easeOut(clamp((t - 60) / 12));
    zombieA.rotation.z = roll;
    zombieB.rotation.z = roll;
  }

  steve.visible = t >= 30 && t < 90;
  steve.position.set(0, 0, 0);
  if (steve.visible) {
    const crouch = t < 45 ? 0.5 : 0.5;
    if (t < 45) steve.position.y = 2.0 * (1 - easeOut(clamp((t - 30) / 15)));
    if (t >= 75) steve.position.x = -8 * easeIn(clamp((t - 75) / 15));
    // присед: колени согнуты, корпус чуть вниз
    steve.userData.legL.rotation.x = -0.9;
    steve.userData.legR.rotation.x = -0.9;
    steve.userData.body.position.y = 0.95;
    steve.userData.head.position.y = 1.65;
    steve.userData.armL.position.y = 0.9;
    steve.userData.armR.position.y = 0.9;
    steve.userData.legL.position.y = 0.3;
    steve.userData.legR.position.y = 0.3;
  }
  if (t >= 43 && t < 44 && steve.visible) spawnDust(0, 0, 0, 12);
  if (t >= 75 && t < 90 && t % 2 === 0) spawnDust(steve.position.x + 0.6, 0.1, 0, 2);
}

let tick = 0;
let paused = false;
let speed = 1;
const speeds = [0.5, 1, 2];
let speedIdx = 1;

document.getElementById('play').onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? 'Играть' : 'Пауза';
};
document.getElementById('speed').onclick = e => {
  speedIdx = (speedIdx + 1) % speeds.length;
  speed = speeds[speedIdx];
  e.target.textContent = `Скорость x${speed}`;
};

let last = performance.now();
const TICK_MS = 50; // 20 тиков в секунду, как в Minecraft

function loop(now) {
  requestAnimationFrame(loop);
  const dt = now - last;
  last = now;
  if (!paused) {
    tick += (dt / TICK_MS) * speed;
    if (tick >= CYCLE) tick -= CYCLE;
  }

  applyFrame(tick);

  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.position.add(d.userData.v);
    d.userData.v.y -= 0.01;
    d.userData.life--;
    d.material.opacity = Math.max(0, d.userData.life / 30) * 0.7;
    if (d.userData.life <= 0) {
      scene.remove(d);
      dust.splice(i, 1);
    }
  }

  document.getElementById('info').textContent = `тик: ${Math.floor(tick)} / ${CYCLE}`;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
